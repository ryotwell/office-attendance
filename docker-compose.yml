version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      ATTEDANCE_QRCODE_KEY: ${ATTEDANCE_QRCODE_KEY}
      TZ: ${TZ:-Asia/Makassar}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

    restart: unless-stopped